name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ============================================================
  #  BACKEND - Build va chay test C#
  # ============================================================
  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Lay code ve
        uses: actions/checkout@v4

      - name: Cai .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/BusTicketing.sln

      - name: Build
        run: dotnet build backend/BusTicketing.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/BusTicketing.sln --no-build --configuration Release

  # ============================================================
  #  FRONTEND - Build React
  # ============================================================
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Lay code ve
        uses: actions/checkout@v4

      - name: Cai Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cai dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
